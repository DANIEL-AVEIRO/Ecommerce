<header class="sticky top-0 z-50 border-b border-stone-900/5 bg-stone-50/90 backdrop-blur-md">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-2 px-4 sm:h-16 sm:gap-4">
    <a
      href="{% url 'index' %}"
      class="min-w-0 shrink-0 font-display text-xl font-extrabold tracking-tight sm:text-2xl {% if request.resolver_match.url_name == 'index' %}text-emerald-700{% else %}text-stone-900{% endif %}"
    >
      DANIEL
    </a>

    <nav class="hidden items-center gap-6 text-sm font-medium lg:flex xl:gap-8">
      <a
        href="{% url 'shop' %}"
        class="transition-colors duration-200 {% if request.resolver_match.url_name == 'shop' and request.GET.category != 'new' %}text-emerald-700 font-semibold{% else %}text-stone-900/70 hover:text-emerald-700{% endif %}"
      >
        Shop
      </a>
      <a
        href="{% url 'shop' %}?category=new"
        class="transition-colors duration-200 {% if request.resolver_match.url_name == 'shop' and request.GET.category == 'new' %}text-emerald-700 font-semibold{% else %}text-stone-900/70 hover:text-emerald-700{% endif %}"
      >
        New
      </a>
      <a
        href="{% url 'about' %}"
        class="transition-colors duration-200 {% if request.resolver_match.url_name == 'about' %}text-emerald-700 font-semibold{% else %}text-stone-900/70 hover:text-emerald-700{% endif %}"
      >
        About
      </a>
      <a
        href="{% url 'contact' %}"
        class="transition-colors duration-200 {% if request.resolver_match.url_name == 'contact' %}text-emerald-700 font-semibold{% else %}text-stone-900/70 hover:text-emerald-700{% endif %}"
      >
        Contact
      </a>
    </nav>

    <div class="flex min-w-0 items-center gap-1 sm:gap-2">
      <form action="{% url 'search' %}" method="get" class="hidden xl:block">
        <label class="sr-only" for="nav-search">Search</label>
        <input
          id="nav-search"
          type="search"
          name="q"
          placeholder="Enter your search"
          class="w-44 rounded-md border border-stone-900/10 bg-white/70 px-3 py-1.5 text-sm outline-none transition focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/15 xl:w-48"
        >
      </form>

      <a
        href="{% url 'search' %}"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md transition xl:hidden {% if request.resolver_match.url_name == 'search' %}text-emerald-700{% else %}text-stone-900/70 hover:bg-stone-100 hover:text-emerald-700{% endif %}"
        aria-label="Search"
      >
        <i data-lucide="search" class="h-5 w-5"></i>
      </a>

      <a
        href="{% if user.is_authenticated %}{% url 'account' %}{% else %}{% url 'login' %}{% endif %}"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md transition {% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'account_orders' or request.resolver_match.url_name == 'account_order_detail' or request.resolver_match.url_name == 'account_profile' or request.resolver_match.url_name == 'account_addresses' or request.resolver_match.url_name == 'login' or request.resolver_match.url_name == 'register' %}text-emerald-700{% else %}text-stone-900/70 hover:bg-stone-100 hover:text-emerald-700{% endif %}"
        aria-label="{% if user.is_authenticated %}Account{% else %}Sign in{% endif %}"
      >
        <i data-lucide="user" class="h-5 w-5"></i>
      </a>

      <a
        href="{% url 'wishlist' %}"
        class="relative inline-flex h-9 w-9 items-center justify-center rounded-md transition {% if request.resolver_match.url_name == 'wishlist' %}text-emerald-700{% else %}text-stone-900/70 hover:bg-stone-100 hover:text-emerald-700{% endif %}"
        aria-label="Wishlist"
      >
        <i data-lucide="heart" class="h-5 w-5"></i>
        {% if wishlist_count %}
        <span class="absolute right-0.5 top-0.5 inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-emerald-700 px-1 text-[9px] font-bold text-white">{{ wishlist_count }}</span>
        {% endif %}
      </a>

      <a
        href="{% url 'cart' %}"
        class="relative hidden h-9 w-9 items-center justify-center rounded-md transition lg:inline-flex {% if request.resolver_match.url_name == 'cart' or request.resolver_match.url_name == 'cart_empty' or request.resolver_match.url_name == 'checkout' %}text-emerald-700{% else %}text-stone-900/70 hover:bg-stone-100 hover:text-emerald-700{% endif %}"
        aria-label="Cart"
      >
        <i data-lucide="shopping-bag" class="h-5 w-5"></i>
        {% if cart_count %}
        <span class="absolute right-0.5 top-0.5 inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-emerald-700 px-1 text-[9px] font-bold text-white">{{ cart_count }}</span>
        {% endif %}
      </a>

      <button
        type="button"
        id="mobile-menu-btn"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-stone-900/10 text-stone-900/80 transition hover:border-emerald-700/40 hover:bg-white hover:text-emerald-700 active:scale-[0.98] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700 lg:hidden"
        aria-expanded="false"
        aria-controls="mobile-menu"
        aria-label="Open menu"
      >
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="hidden border-t border-stone-900/5 bg-stone-50 px-4 py-4 lg:hidden">
    <nav class="flex flex-col gap-1 text-sm font-medium">
      <a
        href="{% url 'shop' %}"
        class="flex items-center gap-3 rounded-md px-2 py-2.5 transition hover:bg-stone-100 {% if request.resolver_match.url_name == 'shop' and request.GET.category != 'new' %}bg-emerald-700/10 font-semibold text-emerald-700 hover:bg-emerald-700/10{% else %}text-stone-900{% endif %}"
      >
        <i data-lucide="shopping-bag" class="h-4 w-4 shrink-0"></i>
        Shop
      </a>
      <a
        href="{% url 'shop' %}?category=new"
        class="flex items-center gap-3 rounded-md px-2 py-2.5 transition hover:bg-stone-100 {% if request.resolver_match.url_name == 'shop' and request.GET.category == 'new' %}bg-emerald-700/10 font-semibold text-emerald-700 hover:bg-emerald-700/10{% else %}text-stone-900{% endif %}"
      >
        <i data-lucide="sparkles" class="h-4 w-4 shrink-0"></i>
        New
      </a>
      <a
        href="{% url 'about' %}"
        class="flex items-center gap-3 rounded-md px-2 py-2.5 transition hover:bg-stone-100 {% if request.resolver_match.url_name == 'about' %}bg-emerald-700/10 font-semibold text-emerald-700 hover:bg-emerald-700/10{% else %}text-stone-900{% endif %}"
      >
        <i data-lucide="info" class="h-4 w-4 shrink-0"></i>
        About
      </a>
      <a
        href="{% url 'contact' %}"
        class="flex items-center gap-3 rounded-md px-2 py-2.5 transition hover:bg-stone-100 {% if request.resolver_match.url_name == 'contact' %}bg-emerald-700/10 font-semibold text-emerald-700 hover:bg-emerald-700/10{% else %}text-stone-900{% endif %}"
      >
        <i data-lucide="mail" class="h-4 w-4 shrink-0"></i>
        Contact
      </a>
    </nav>
  </div>
</header>

<script>
  (function () {
    const btn = document.getElementById("mobile-menu-btn");
    const menu = document.getElementById("mobile-menu");
    if (!btn || !menu) return;
    btn.addEventListener("click", function () {
      const open = !menu.classList.contains("hidden");
      menu.classList.toggle("hidden", open);
      btn.setAttribute("aria-expanded", String(!open));
      btn.setAttribute("aria-label", open ? "Open menu" : "Close menu");
      btn.innerHTML = open
        ? '<i data-lucide="menu" class="h-5 w-5"></i>'
        : '<i data-lucide="x" class="h-5 w-5"></i>';
      if (window.lucide) lucide.createIcons({ nodes: [btn] });
    });
  })();
</script>
