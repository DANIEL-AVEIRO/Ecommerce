<span class="star__row{% if star_size == 'sm' %} star__row__sm{% endif %}"
      aria-label="{{ rating }} out of 5 stars"
      role="img">
  {% for i in "12345" %}
    <svg class="star__icon{% if forloop.counter <= rating %} is__filled{% endif %}"
         viewBox="0 0 24 24"
         aria-hidden="true">
      <path d="M12 2.5l2.9 5.88 6.49.94-4.7 4.58 1.11 6.47L12 17.77l-5.8 3.05 1.11-6.47-4.7-4.58 6.49-.94L12 2.5z" />
    </svg>
  {% endfor %}
</span>
