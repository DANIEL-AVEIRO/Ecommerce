{% extends "website/components/base.html" %}
{% block title %}Reset password — DANIEL{% endblock %}
{% block content %}
  <div class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-md items-center px-4 py-16">
    <div class="w-full">
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-emerald-800/70">Account recovery</p>
      <h1 class="mt-3 font-display text-4xl font-bold tracking-tight">New password</h1>
      <p class="mt-3 text-sm text-stone-900/55">Choose a new password for your account.</p>
      <form action="{% url 'reset_password' uidb64 token %}"
            method="post"
            class="mt-10 space-y-5">
        {% csrf_token %}
        <div>
          <label for="password" class="label">New password</label>
          <input id="password"
                 name="password"
                 type="password"
                 required
                 minlength="8"
                 class="field"
                 placeholder="At least 8 characters">
        </div>
        <div>
          <label for="password_confirm" class="label">Confirm password</label>
          <input id="password_confirm"
                 name="password_confirm"
                 type="password"
                 required
                 minlength="8"
                 class="field"
                 placeholder="Repeat password">
        </div>
        <button type="submit" class="btn__dark w-full !py-3.5">Update password</button>
      </form>
    </div>
  </div>
{% endblock %}
