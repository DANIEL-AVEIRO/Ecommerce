{% extends "website/components/base.html" %}
{% block title %}Page not found — DANIEL{% endblock %}
{% block content %}
  <div class="mx-auto flex min-h-[60vh] max-w-lg flex-col items-center justify-center px-4 py-20 text-center">
    <p class="font-display text-5xl font-extrabold tracking-tight text-emerald-700/30 sm:text-7xl">404</p>
    <h1 class="mt-4 font-display text-3xl font-bold tracking-tight">Page not found</h1>
    <p class="mt-3 text-sm text-stone-900/60 sm:text-base">The page you’re looking for doesn’t exist or has moved.</p>
    <form action="{% url 'search' %}"
          method="get"
          class="mt-8 flex w-full max-w-sm flex-col gap-2 sm:flex-row">
      <label class="sr-only" for="404-search">Search</label>
      <input id="404-search"
             type="search"
             name="q"
             placeholder="Enter your search"
             class="field !mt-0">
      <button type="submit" class="btn__dark shrink-0 !py-3">Search</button>
    </form>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a href="{% url 'index' %}" class="btn__primary">Go home</a>
      <a href="{% url 'shop' %}" class="btn__ghost">Browse shop</a>
    </div>
    <p class="mt-8 text-sm text-stone-900/50">
      Need help?
      <a href="{% url 'contact' %}"
         class="text-emerald-700 hover:text-emerald-600">Contact us</a>
      or read the
      <a href="{% url 'faq' %}"
         class="text-emerald-700 hover:text-emerald-600">FAQ</a>.
    </p>
  </div>
{% endblock %}
