{% extends "website/components/base.html" %}

{% block title %}Profile — DANIEL{% endblock %}

{% block content %}
<div class="border-b border-stone-900/5 bg-gradient-to-b from-stone-50 to-stone-100">
  <div class="mx-auto max-w-6xl px-4 py-10 sm:py-12">
    <h1 class="font-display text-3xl font-bold tracking-tight sm:text-4xl">Profile</h1>
    <p class="mt-2 text-sm text-stone-900/60 sm:text-base">Update your personal details.</p>
  </div>
</div>

<div class="mx-auto max-w-6xl px-4 py-8 sm:py-10">
  <div class="grid gap-8 lg:grid-cols-4">
    {% include "website/components/account_nav.html" with active="profile" %}
    <div class="lg:col-span-3">
      <form action="{% url 'account_profile' %}" method="post" class="rounded-lg border border-stone-900/10 bg-white p-4 sm:p-6">
        {% csrf_token %}
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="first_name" class="label">First name</label>
            <input id="first_name" name="first_name" value="{{ user.first_name }}" required class="field" placeholder="Enter your first name">
          </div>
          <div>
            <label for="last_name" class="label">Last name</label>
            <input id="last_name" name="last_name" value="{{ user.last_name }}" class="field" placeholder="Enter your last name">
          </div>
          <div class="sm:col-span-2">
            <label for="email" class="label">Email</label>
            <input id="email" name="email" type="email" value="{{ user.email }}" required class="field" placeholder="Enter your email">
          </div>
          <div class="sm:col-span-2">
            <label for="phone" class="label">Phone</label>
            <input id="phone" name="phone" type="tel" value="{{ profile.phone }}" class="field" placeholder="Enter your phone number">
          </div>
        </div>

        <hr class="my-8 border-stone-900/10">
        <h2 class="font-display text-lg font-bold">Change password</h2>
        <div class="mt-4 grid gap-4 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label for="current_password" class="label">Current password</label>
            <input id="current_password" name="current_password" type="password" class="field" placeholder="Enter your current password">
          </div>
          <div>
            <label for="new_password" class="label">New password</label>
            <input id="new_password" name="new_password" type="password" class="field" placeholder="Enter your new password">
          </div>
          <div>
            <label for="confirm_password" class="label">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password" class="field" placeholder="Enter your new password again">
          </div>
        </div>
        <button type="submit" class="btn-primary mt-8">Save changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
