{% extends "website/components/base.html" %}
{% block title %}Request return — DANIEL{% endblock %}
{% block content %}
  <div class="mx-auto max-w-xl px-4 py-12">
    <h1 class="font-display text-3xl font-bold tracking-tight">Request a return</h1>
    <p class="mt-2 text-sm text-stone-900/60">Order {{ order.order_number }}</p>
    <form action="{% url 'account_return_request' order.order_number %}"
          method="post"
          class="mt-8 space-y-4">
      {% csrf_token %}
      <div>
        <label for="reason" class="label">Why are you returning?</label>
        <textarea id="reason"
                  name="reason"
                  rows="5"
                  required
                  class="field"
                  placeholder="Wrong size, damaged, changed mind…"></textarea>
      </div>
      <button type="submit" class="btn__primary">Submit return request</button>
    </form>
  </div>
{% endblock %}
