<form method="get" class="dashboard__filters mb-5 rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm">
  <div class="flex flex-col gap-3 lg:flex-row lg:items-end">
    <div class="min-w-0 flex-1">
      <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-400">Search</label>
      <input type="search"
             name="search"
             value="{{ search }}"
             placeholder="{{ search_placeholder|default:'Search…' }}"
             class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm">
    </div>
    {% if filter_fields %}
      {% for field in filter_fields %}
        <div class="w-full lg:w-44">
          <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-400">{{ field.label }}</label>
          <select name="{{ field.name }}"
                  class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm">
            <option value="">{{ field.all_label|default:"All" }}</option>
            {% for value, label in field.choices %}
              <option value="{{ value }}"
                      {% if field.selected == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      {% endfor %}
    {% endif %}
    <div class="flex flex-wrap gap-2">
      <button type="submit" class="btn btn__secondary">
        <i data-lucide="search" class="h-4 w-4"></i>
        Search
      </button>
      {% if search or has_filters %}
        <a href="{{ clear_url }}" class="btn btn__ghost">Clear</a>
      {% endif %}
    </div>
  </div>
</form>
