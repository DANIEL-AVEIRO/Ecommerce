<header class="dashboard__topbar sticky top-0 z-20">
  <div class="dashboard__topbar__inner flex h-[4.25rem] items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <button type="button"
              id="sidebar-toggle"
              class="dashboard__topbar__icon lg:hidden"
              aria-label="Open menu">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span class="dashboard__topbar__kicker">Admin</span>
          <span class="dashboard__topbar__dot" aria-hidden="true"></span>
          <span class="dashboard__topbar__kicker hidden sm:inline">Live store</span>
        </div>
        <h1 class="mt-0.5 truncate font-display text-lg font-bold tracking-tight sm:text-xl">
          {{ page_title|default:"Overview" }}
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-2.5">
      <button type="button"
              id="theme-toggle"
              class="dashboard__topbar__icon relative"
              aria-label="Toggle color mode">
        <i data-lucide="sun" class="icon__sun absolute h-[1.15rem] w-[1.15rem]"></i>
        <i data-lucide="moon" class="icon__moon absolute h-[1.15rem] w-[1.15rem]"></i>
      </button>

      <a href="{% url 'index' %}"
         target="_blank"
         class="dashboard__topbar__chip hidden sm:inline-flex">
        <i data-lucide="store" class="h-4 w-4 shrink-0 text-teal-700"></i>
        <span>Storefront</span>
        <i data-lucide="arrow-up-right" class="h-3.5 w-3.5 shrink-0 opacity-50"></i>
      </a>

      <div class="dashboard__topbar__user hidden sm:flex">
        <div class="dashboard__topbar__avatar" aria-hidden="true">
          {{ user.username|slice:":1"|upper }}
        </div>
        <div class="min-w-0 leading-tight">
          <p class="truncate text-sm font-semibold">{{ user.username }}</p>
          <p class="dashboard__topbar__role truncate text-[11px]">Staff account</p>
        </div>
      </div>

      <form action="{% url 'dashboard_logout' %}" method="post" class="shrink-0">
        {% csrf_token %}
        <button type="submit" class="dashboard__topbar__logout" aria-label="Sign out">
          <i data-lucide="log-out" class="h-4 w-4"></i>
          <span class="hidden md:inline">Sign out</span>
        </button>
      </form>
    </div>
  </div>
</header>
