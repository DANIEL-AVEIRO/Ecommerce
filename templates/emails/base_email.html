<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}DANIEL{% endblock %}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f5f5f4;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {% block preheader %}{% endblock %}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
          <tr>
            <td style="background-color:#1c1917;border-radius:16px 16px 0 0;padding:28px 32px;text-align:center;">
              <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;letter-spacing:0.04em;color:#34d399;">
                DANIEL
              </p>
              <p style="margin:8px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(245,245,244,0.45);">
                Everyday essentials
              </p>
            </td>
          </tr>

          <tr>
            <td style="height:3px;background:linear-gradient(90deg,#047857 0%,#34d399 50%,#047857 100%);background-color:#047857;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <tr>
            <td style="background-color:#ffffff;padding:36px 32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1c1917;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="background-color:#1c1917;border-radius:0 0 16px 16px;padding:24px 32px;text-align:center;">
              <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:rgba(245,245,244,0.55);">
                Ships nationwide from Yangon · Quiet craft, everyday wear
              </p>
              <p style="margin:12px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.6;color:rgba(245,245,244,0.4);">
                © {% now "Y" %} DANIEL · Designed by
                <a href="https://codedbydaniel.vercel.app" style="color:#34d399;text-decoration:none;font-weight:600;">Daniel Aveiro</a>
              </p>
              {% if shop_url %}
              <p style="margin:14px 0 0;">
                <a href="{{ shop_url }}" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;color:#34d399;text-decoration:none;">
                  Visit the shop →
                </a>
              </p>
              {% endif %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
